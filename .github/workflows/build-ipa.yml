name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check source files
        run: |
          ls -la Sources
          for f in Sources/App.swift Sources/Features.swift Sources/Sensitivity.swift; do
            if [ ! -f "$f" ]; then echo "THIẾU FILE: $f"; exit 1; fi
          done
          if ! grep -q "enum Theme" Sources/App.swift; then
            echo "Sources/App.swift là BẢN CŨ. Hãy dán lại nội dung App.swift mới."
            exit 1
          fi
          if ls Sources/*.swift | grep -vE "App.swift|Features.swift|Sensitivity.swift"; then
            echo "Có file .swift lạ trong Sources/ (ở trên), hãy xoá nó."
            exit 1
          fi

      - name: Prepare music and icon
        run: |
          mkdir -p Resources
          echo "music folder" > Resources/placeholder.txt
          for f in *.mp3 *.m4a *.wav; do
            if [ -f "$f" ]; then cp "$f" Resources/; fi
          done
          ls Resources
          mkdir -p Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          ICON=""
          if [ -f AppIcon.png ]; then
            sips -z 1024 1024 -s format jpeg AppIcon.png --out /tmp/icon.jpg
            sips -s format png /tmp/icon.jpg --out Assets.xcassets/AppIcon.appiconset/AppIcon.png
            ICON='"filename":"AppIcon.png",'
          fi
          echo "{\"images\":[{${ICON}\"idiom\":\"universal\",\"platform\":\"ios\",\"size\":\"1024x1024\"}],\"info\":{\"author\":\"xcode\",\"version\":1}}" > Assets.xcassets/AppIcon.appiconset/Contents.json
          cat Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          echo "=== project.yml ==="
          cat project.yml
          echo "=== generate ==="
          xcodegen generate
          echo "=== files ==="
          ls -la

      - name: Build (unsigned)
        shell: bash
        run: |
          PROJ=$(ls -d *.xcodeproj | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "Không thấy file .xcodeproj. Kiểm tra lại project.yml"
            exit 1
          fi
          echo "Project: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "=========== CÁC DÒNG LỖI ==========="
          grep -E "error:" build.log | sort -u | head -40 || true
          echo "====================================="

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "Không thấy file .app sau khi build"
            exit 1
          fi
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LicenseApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LicenseApp-ipa
          path: LicenseApp.ipa
